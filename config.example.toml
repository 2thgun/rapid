[acc]
enabled = false
host = "192.168.1.89"
port = 9000
local_port = 9000
password = "replace-with-ACC-connection-password"
display_name = "raPId"
protocol_version = 4
update_interval_ms = 100

[app]
host = "0.0.0.0"
port = 8000
database_path = "data/rapid.db"
companion_port = 9001
# Empty means: learn the first valid private/link-local sender, lock to it while
# packets are live, then allow a different rig 1.5 seconds after it disconnects.
companion_host = ""
# New customer installations pair the Pi and Windows companion. Pairing creates
# a distinct v4 credential per Windows account and stores it in the Pi's private
# peer store and Windows DPAPI; it is never copied as a 64-character hex value.
# `companion_key` remains an upgrade-only compatibility input for prepared demo
# kits until the pairing migration is complete. Do not add it to a fresh config.
# companion_key = ""
telemetry_directory = "data/telemetry"
# Directory shared with rapid-network-mode.service. Leave unchanged on the Pi.
network_control_directory = "/run/rapid-network"

[setup]
# Opt-in foundation only: read-only /api/v1/setup, no provisioning UI yet.
# Empty keeps existing installations unchanged. Parent directory must exist;
# a new leaf directory is created privately, existing leaf must be mode 0700.
state_directory = ""

[upload]
enabled = false
url = "https://telemetry.example.com"
# Prefer RAPID_UPLOAD_TOKEN or a systemd EnvironmentFile for this secret.
token = ""
# races: race sessions default on; all: every session; manual: opt-in only.
policy = "races"
queue_path = "data/upload-queue.db"
retention_days = 14
