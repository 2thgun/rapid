<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>raPId setup</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151c;color:#edf2f7}
body{max-width:560px;margin:0 auto;padding:32px 20px}h1{margin-bottom:8px}p{color:#b8c4d2;line-height:1.5}
section{background:#1a2330;border:1px solid #344254;border-radius:16px;padding:24px;margin-top:24px}
label{display:block;margin-bottom:8px}input,select,button{box-sizing:border-box;width:100%;font:inherit;min-height:48px;border-radius:8px}
input,select{padding:12px;background:#10151c;border:1px solid #62758e;color:inherit}button{margin-top:16px;background:#69d9b3;border:0;color:#10251e;font-weight:650;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}dt{color:#b8c4d2;margin-top:16px}dd{margin:4px 0;overflow-wrap:anywhere}
[hidden]{display:none!important}#message{min-height:24px;color:#f9cc85}
</style>
<h1>raPId setup</h1>
<p>Manage your device.</p>
<p id="message" role="status" aria-live="polite"></p>
<section id="login" hidden>
<h2>Owner sign-in</h2>
<form id="login-form">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required maxlength="256">
<button id="sign-in" type="submit">Sign in</button>
</form>
</section>
<section id="profile" hidden>
<h2>Saved device profile</h2>
<form id="settings-form">
<label for="hostname">Device name</label>
<input id="hostname" autocomplete="off" required maxlength="63" pattern="[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?">
<label for="rotation">Orientation</label>
<select id="rotation"><option value="0">Landscape</option><option value="180">Upside-down landscape</option></select>
<button id="save-settings" type="submit">Save profile</button>
</form>
<dl><dt>Startup preference</dt><dd>Saved Wi-Fi, then access point</dd></dl>
<p>Saving records your preference only. Wi-Fi and display controls are coming in a later update.</p>
<button id="sign-out" type="button">Sign out</button>
</section>
<script>
'use strict';
let csrf = '';
let revision = null;
const message = document.getElementById('message');
async function api(path, method='GET', body) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (csrf) headers['X-CSRF-Token'] = csrf;
  const response = await fetch(path, {method, headers, credentials:'same-origin', cache:'no-store', body:body === undefined ? undefined : JSON.stringify(body)});
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(response.status === 429 ? 'Too many attempts. Wait a minute and try again.' : result.detail || 'Request failed.');
    error.status = response.status;
    throw error;
  }
  return result;
}
function showLogin() {
  csrf = '';
  document.getElementById('profile').hidden = true;
  document.getElementById('login').hidden = false;
}
async function showProfile() {
  const data = await api('/api/v1/settings');
  revision = data.revision;
  document.getElementById('hostname').value = data.settings.hostname;
  document.getElementById('rotation').value = String(data.settings.rotation);
  document.getElementById('login').hidden = true;
  document.getElementById('profile').hidden = false;
}
document.getElementById('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('sign-in');
  const input = document.getElementById('password');
  const password = input.value;
  input.value = '';
  button.disabled = true;
  message.textContent = '';
  try {
    const session = await api('/api/v1/auth/login', 'POST', {password});
    csrf = session.csrf_token;
    await showProfile();
  } catch (error) { message.textContent = error.message; }
  finally { button.disabled = false; }
});
document.getElementById('settings-form').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('save-settings');
  button.disabled = true;
  message.textContent = '';
  try {
    const settings = {hostname: document.getElementById('hostname').value,
      rotation: Number(document.getElementById('rotation').value), boot_network: 'home_then_ap'};
    const saved = await api('/api/v1/settings', 'POST', {revision, settings});
    revision = saved.revision;
    message.textContent = 'Profile saved. It has not been applied to the device.';
  } catch (error) {
    if (error.status === 409) await showProfile();
    message.textContent = error.message;
  } finally { button.disabled = false; }
});
document.getElementById('sign-out').addEventListener('click', async () => {
  try {
    await api('/api/v1/auth/logout', 'POST', {});
    showLogin();
    message.textContent = 'Signed out.';
  } catch (error) {
    if (error.status === 401) showLogin();
    message.textContent = error.message;
  }
});
(async () => {
  try {
    const status = await api('/api/v1/setup');
    if (!status.owner_configured) {
      message.textContent = 'Setup needs to be activated on this device.';
      return;
    }
    try {
      const session = await api('/api/v1/auth/session');
      csrf = session.csrf_token;
      await showProfile();
    } catch (error) {
      if (error.status !== 401) throw error;
      showLogin();
    }
  } catch (error) { message.textContent = error.message; }
})();
</script>
</html>
