<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>raPId Live Telemetry</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#090c10;color:#e9eef2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090c10}
header{height:58px;padding:0 18px;display:flex;align-items:center;gap:18px;background:#12171d;border-bottom:1px solid #2b3540}
h1{font-size:17px;margin:0;color:#f7bd21}#connection{font-size:12px;color:#8fa0ae}.grow{flex:1}
button,select{background:#1a222a;color:#e9eef2;border:1px solid #394754;border-radius:4px;padding:7px 9px}
button.active{border-color:#f7bd21;color:#f7bd21}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}
aside{padding:14px;border-right:1px solid #2b3540;background:#0f1419;overflow:auto}.group{margin-bottom:18px}
.group-title{font-size:11px;color:#8fa0ae;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
label{display:block;font-size:12px;padding:3px 0}input{accent-color:#f7bd21}main{padding:12px;min-width:0}
#summary{display:flex;gap:20px;padding:8px 10px;background:#111820;border:1px solid #293641;font-size:12px;margin-bottom:10px}
#summary strong{color:#f7bd21}.chart{position:relative;height:calc(100vh - 116px);min-height:420px;background:#0d1217;border:1px solid #293641}
canvas{width:100%;height:100%;display:block}.legend{position:absolute;left:10px;top:8px;display:flex;flex-wrap:wrap;gap:10px;font-size:11px;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.notice{color:#ff6877}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #2b3540}.chart{height:60vh}}
</style></head><body>
<header><h1>raPId engineering telemetry</h1><span id="connection">connecting…</span><span class="grow"></span>
<button id="pause">Pause</button><select id="window"><option>10</option><option selected>30</option><option>60</option><option>120</option></select><span>s</span></header>
<div class="layout"><aside><div class="group"><div class="group-title">Presets</div><select id="preset"></select></div>
<div class="group"><div class="group-title">Traces (maximum 8)</div><div id="channels"></div></div>
<div class="group"><div class="group-title">Session upload</div><label><input type="checkbox" id="upload"> Upload after session</label><small id="upload-state"></small></div></aside>
<main><div id="summary"><span>SIM <strong id="sim">—</strong></span><span>SESSION <strong id="session">—</strong></span><span>LAP <strong id="lap">—</strong></span><span>RATE <strong id="rate">—</strong></span><span>LOSS <strong id="loss">0</strong></span></div>
<div class="chart"><canvas id="plot"></canvas><div class="legend" id="legend"></div></div></main></div>
<script>
const colors=['#f7bd21','#29d783','#ff596d','#43bff2','#b887ff','#ff943d','#65e0d0','#f06ed4'];
const presets={
'Driver inputs':['throttle','brake','steering_angle','speed_kmh','gear'],
'Engine / vehicle':['rpm','speed_kmh','g_x','g_y','g_z','wheel_speed_fl','wheel_speed_fr','wheel_speed_rl'],
'Tyres':['pressure_fl','pressure_fr','pressure_rl','pressure_rr','core_temp_fl','core_temp_fr','core_temp_rl','core_temp_rr'],
'Suspension':['suspension_fl','suspension_fr','suspension_rl','suspension_rr']};
const channelNames=[...new Set(Object.values(presets).flat())];let selected=[...presets['Driver inputs']],paused=false,samples=[],lastMono=null;
const el=id=>document.getElementById(id), channels=el('channels'), preset=el('preset');
Object.keys(presets).forEach(name=>preset.add(new Option(name,name)));
function renderChoices(){channels.innerHTML='';channelNames.forEach(name=>{const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=selected.includes(name);box.onchange=()=>{if(box.checked&&selected.length>=8){box.checked=false;return}selected=box.checked?[...selected,name]:selected.filter(x=>x!==name);draw()};label.append(box,document.createTextNode(' '+name));channels.append(label)})}
preset.onchange=()=>{selected=[...presets[preset.value]].slice(0,8);renderChoices();draw()};renderChoices();
el('pause').onclick=()=>{paused=!paused;el('pause').classList.toggle('active',paused);el('pause').textContent=paused?'Resume':'Pause'};
el('upload').onchange=async()=>{const response=await fetch('/api/v1/session/upload',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:el('upload').checked})});if(!response.ok)el('upload').checked=!el('upload').checked};
async function status(){try{const s=await (await fetch('/api/v1/status',{cache:'no-store'})).json();el('sim').textContent=s.simulator||'—';el('session').textContent=s.session_name||s.session_id||'—';el('lap').textContent=s.lap_number??'—';el('rate').textContent=s.sample_rate_hz?`${s.sample_rate_hz} Hz`:'—';el('loss').textContent=s.packets_lost||0;el('upload').checked=!!s.upload_after_session;el('upload-state').textContent=s.upload_state||''}catch(_){}}setInterval(status,1000);status();
function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/v1/live?history=30`);ws.onopen=()=>el('connection').textContent='live';ws.onclose=()=>{el('connection').textContent='reconnecting…';setTimeout(connect,1000)};ws.onmessage=e=>{if(paused)return;const packet=JSON.parse(e.data);for(const item of packet.events||[]){if(item.type==='sample'){lastMono=item.monotonic_us||lastMono;samples.push(item)}}const seconds=Number(el('window').value),cutoff=(lastMono||0)-seconds*1e6;samples=samples.filter(x=>!x.monotonic_us||x.monotonic_us>=cutoff);draw();if(packet.dropped)el('connection').textContent=`live (viewer skipped ${packet.dropped})`}}connect();
function draw(){const canvas=el('plot'),dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);const c=canvas.getContext('2d');c.scale(dpr,dpr);const w=rect.width,h=rect.height;c.fillStyle='#0d1217';c.fillRect(0,0,w,h);c.strokeStyle='#202b34';c.lineWidth=1;for(let i=1;i<10;i++){const x=w*i/10;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}selected.forEach((name,index)=>{const vals=samples.map(s=>[s.monotonic_us,s.values[name]]).filter(x=>Number.isFinite(x[1]));if(vals.length<2)return;let lo=Math.min(...vals.map(x=>x[1])),hi=Math.max(...vals.map(x=>x[1]));if(lo===hi){lo-=1;hi+=1}const t0=lastMono-Number(el('window').value)*1e6;c.strokeStyle=colors[index];c.lineWidth=1.4;c.beginPath();let started=false;vals.forEach(([t,v])=>{const x=(t-t0)/(Number(el('window').value)*1e6)*w,y=h-((v-lo)/(hi-lo)*.84+.08)*h;if(!started){c.moveTo(x,y);started=true}else c.lineTo(x,y)});c.stroke()});el('legend').innerHTML=selected.map((n,i)=>`<span><i class="dot" style="background:${colors[i]}"></i>${n}</span>`).join('')}
addEventListener('resize',draw);
</script></body></html>
