[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-archive-server"
version = "0.1.0"
description = "Authenticated telemetry archive receiver for raPId"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1.0",
  "WsgiDAV>=4.3,<5",
  "cheroot>=10,<12",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["archive_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
