name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp-native:
    needs: windows-companion
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-v4-fixtures
          path: build/windows-v4-fixtures
      - run: sudo apt-get update && sudo apt-get install -y libsystemd-dev pkg-config libsqlite3-dev libcurl4-openssl-dev libssl-dev nlohmann-json3-dev libboost-system-dev libtomlplusplus-dev libargon2-dev
      - run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRAPID_BUILD_LOG_STATUS=ON -DRAPID_V4_FIXTURES=${{ github.workspace }}/build/windows-v4-fixtures
      - run: cmake --build build/cpp
      - run: ctest --test-dir build/cpp --output-on-failure
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: pwsh
        run: ./companion/build-native-daemon.ps1 -Compiler MSVC
      - run: node cpp/tests/dashboard_graph_tests.js
      - shell: pwsh
        run: ./companion/rapid-telemetry-daemon.exe --self-test --output-directory "$env:RUNNER_TEMP/rapid-self-test"
      - shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - shell: pwsh
        run: ./companion/build-msi.ps1 -ExecutablePath ./companion/rapid-telemetry-daemon.exe -OutputPath ./dist/raPId-Companion.msi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rapid-windows-msi
          path: dist/raPId-Companion.msi
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rapid-windows-companion
          path: |
            companion/rapid-telemetry-daemon.exe
            companion/START-RAPID.cmd
            companion/start-rapid-daemon.vbs
            companion/install-demo.cmd
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-v4-fixtures
          path: ${{ runner.temp }}/rapid-self-test/v4-fixtures/*.hex
          if-no-files-found: error
          retention-days: 7
