Section "ServerFlags"
    # The Pi's unused DRM HDMI device has no connector.  Do not add it as a
    # second X screen after the explicit GPIO framebuffer below.
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "raPId GPIO framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "raPId GPIO screen"
    Device "raPId GPIO framebuffer"
    DefaultDepth 16
EndSection
