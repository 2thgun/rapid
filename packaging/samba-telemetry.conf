# raPId Telemetry share (#66). The image includes this file from
# /etc/samba/smb.conf. Samba ships disabled; rapid-account sets the share's
# password from the owner's device password and starts smbd and nmbd.
[Telemetry]
   comment = raPId finalized MoTeC telemetry
   path = /var/lib/rapid/telemetry
   valid users = rapid
   read only = yes
   veto files = /.rapid-*/
