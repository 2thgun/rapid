[app]
host = "127.0.0.1"
port = 8000
database_path = "/var/lib/rapid/rapid.db"
telemetry_directory = "/var/lib/rapid/telemetry"
assets_directory = "/usr/share/rapid"

[setup]
state_directory = "/var/lib/rapid-setup"

[pairing]
# Pairing is served by rapid-pi over its own TLS listener. The setup service
# remains the owner/panel control surface.
enabled = true
host = "0.0.0.0"
port = 8003

[acc]
enabled = false

[upload]
enabled = false
queue_path = "/var/lib/rapid/upload-queue.db"
